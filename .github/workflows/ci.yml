name: Full CI/CD Pipeline (Docker Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    # Built and tested twice, in parallel: on x86 and on ARM64. The production
    # server (Oracle Cloud Ampere A1) is ARM64, so a package or base image that
    # has no ARM build fails here, not on the server. (Free ARM runners need a
    # public repository.)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx (important for pro builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image (MAIN STEP)
      - name: Build Docker image
        run: |
          docker build -t legal-hybrid-rag .

      # 4. Run the container and PROVE it is alive.
      #    This used to be `docker run -d; sleep 10; docker logs; docker stop`,
      #    which passes even when the app crashes on startup: printing logs does
      #    not fail a step, and `docker stop` succeeds on an already-dead
      #    container. That is how a .dockerignore rule excluding two modules
      #    parser.py imports stayed green here while every Render deploy failed.
      # 4a. The image must contain every module the app imports. This needs no
      #     database and cannot be flaky: it is exactly the check that would
      #     have caught the missing classifier modules on the first push.
      - name: Image contains every module the app imports
        run: |
          docker run --rm legal-hybrid-rag \
            python -c "import main; print('app imports OK')"

      # 4a-2. Every route must refuse a caller with no token unless it is on the
      #     reviewed public list, and only one route may start a search. Needs no
      #     database. A new unprotected route fails the build here.
      - name: Every route is protected
        run: |
          docker run --rm -e JWT_SECRET="ci-$(openssl rand -hex 32)" legal-hybrid-rag \
            python -m app.api.access_selfcheck --routes

      # 4b. It must then actually serve. --network host so the MongoDB service
      #     container is reachable at localhost, the same way the job sees it.
      # 4a. The AI models are in the image and load with the network off, so a
      #     container never depends on downloading them (Hugging Face) to search.
      - name: Models are built into the image
        run: |
          docker run --rm --network none -e JWT_SECRET="ci-$(openssl rand -hex 32)" legal-hybrid-rag \
            python -m scripts.fetch_models --check

      - name: Container starts and answers /api/health/live
        run: |
          docker run -d --name test-container --network host \
            -e MONGO_URL="mongodb://localhost:27017" \
            -e JWT_SECRET="ci-$(openssl rand -hex 32)" legal-hybrid-rag
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' test-container)" != "true" ]; then
              echo "::error::The container exited during startup."
              docker logs test-container
              exit 1
            fi
            # /api/health/live: the process serves. (/api/health is readiness, and needs
            # the search indexes, which are copied onto the server, not built into the image.)
            if curl -fsS http://localhost:8000/api/health/live >/dev/null 2>&1; then
              echo "Serving /health after ~$((i * 2))s."
              docker stop test-container
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health/live did not answer within 60s."
          docker logs test-container
          exit 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deployment placeholder
        run: echo "Ready to deploy Docker image to cloud (Render / AWS / Railway)"