# Running the whole app with Docker.
#
# The image holds the code only. Everything that must survive a rebuild or a
# container restart lives on the host and is mounted in:
#
#   backend/chroma_db/      vector store       (copy it in once, before `up`)
#   backend/lexical.db      keyword index      (copy it in once, before `up`)
#   backend/uploads/        uploaded PDFs, avatars and blog covers
#   backend/logs/           errors.log (app/monitoring.py)
#   backend/backups/        daily database backups (scripts/backup_db.py);
#                           copy them OFF this machine too (BACKUP_COPY_DIR)
#   backend/secrets/        Google Drive files: client_secret.json and token.json
#                           (token.json is rewritten when Google refreshes it)
#
# These are NOT in git and NOT in the image, so `git pull` and
# `docker compose up -d --build` never replace or delete them: copy the search
# data to the server once (deploy/sync_search_data.ps1) and every later code
# deploy keeps it. PDFs uploaded on the server's admin page are added to these
# same folders. Not even `docker compose down -v` removes them (that deletes
# named volumes only, i.e. caddy's certificates).
#
# The database is MongoDB Atlas (not run here).
#
# Settings: backend/.env (app secrets, git-ignored) and .env next to this file
# (server-specific, git-ignored), which must hold:
#   DOMAIN=your-site.example
#   FRONTEND_URL=https://your-site.example
#   MONGO_URL=mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority
# (Atlas: letters and digits only in the password, or URL-encode it, and add
# this server's public IP under Network Access.) Then:
#   docker compose up -d --build
# Missing search data, or any of the three settings, stops `up` with an error
# instead of starting a site that cannot work.
#
# HTTPS: the "caddy" service answers on ports 80/443, gets and renews the
# certificate for DOMAIN itself (deploy/Caddyfile) and passes requests on to the
# backend. The backend is NOT published to the internet: it trusts the
# client address the proxy forwards, so it must only be reachable through it.
# Sign-in tokens live in the browser (a day, renewed while in use); without
# HTTPS anyone on the network path could read them.

services:
  backend:
    build: .
    # Size the machine for the app: at least 4 GB of memory and 4 CPU cores
    # (searches are CPU-bound; one holds ~1.6 GB, a few at once ~2 GB, and an
    # upload being OCR'd adds more). Run ONE backend: limits, the search queue
    # and the search index files belong to a single process.
    # Only this machine can reach the backend directly (for checks such as
    # curl http://127.0.0.1:8001/api/health); everyone else goes through caddy.
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # The port inside the container, which caddy, the port mapping above and the
      # healthcheck all use. backend/.env says PORT=5000 (the local dev server's
      # port); without this line the container listened on 5000 while caddy
      # called 8000, and every page answered 502.
      PORT: "8000"
      # Overrides backend/.env (whose MONGO_URL is the developer's localhost).
      MONGO_URL: ${MONGO_URL:?Set MONGO_URL in .env to the MongoDB Atlas connection string (mongodb+srv://...)}
      DB_NAME: legal_rag
      # Links in emails (password reset, reactivation) and the Stripe return
      # address use this; localhost would point users at their own machine.
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public address of the site, e.g. https://your-site.example}
      GOOGLE_DRIVE_TOKEN_FILE: secrets/token.json
      GOOGLE_DRIVE_CLIENT_SECRET_FILE: secrets/client_secret.json
    volumes:
      - type: bind
        source: ./backend/chroma_db
        target: /app/backend/chroma_db
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/lexical.db
        target: /app/backend/lexical.db
        bind:
          create_host_path: false
      - ./backend/uploads:/app/backend/uploads
      - ./backend/secrets:/app/backend/secrets
      - ./backend/logs:/app/backend/logs
      - ./backend/backups:/app/backend/backups
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the site's domain name, e.g. your-site.example (its DNS must point here)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep them, or Let's Encrypt rate-limits re-issuing
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
